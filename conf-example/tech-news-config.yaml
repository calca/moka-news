# MoKa News - Technology News Configuration
# Perfect for developers and tech enthusiasts

ai:
  provider: gemini-cli
  language: en  # Editorial language: en, it, es, fr
  
  keywords:
    - programming
    - software development
    - artificial intelligence
    - machine learning
    - web development
    - mobile development
    - devops
    - cloud computing
    - cybersecurity
    - blockchain
    - startups
    - open source

# Curated tech news feeds
feeds:
  urls:
    # Core Tech News
    - https://news.ycombinator.com/rss
    - https://www.reddit.com/r/programming/.rss
    - https://stackoverflow.blog/feed/
    
    # Development Blogs
    - https://github.blog/feed/
    - https://blog.jetbrains.com/feed/
    - https://code.visualstudio.com/feed.xml
    
    # AI & ML
    - https://blog.openai.com/rss/
    - https://ai.googleblog.com/feeds/posts/default
    - https://research.fb.com/feed/
    
    # Cloud & DevOps
    - https://cloud.google.com/blog/rss/
    - https://aws.amazon.com/blogs/aws/feed/
    - https://azure.microsoft.com/en-us/blog/feed/
    
    # Security
    - https://krebsonsecurity.com/feed/
    - https://www.schneier.com/blog/atom.xml
    
    # Industry News
    - https://techcrunch.com/category/startups/feed/
    - https://www.theverge.com/rss/index.xml

ui:
  use_tui: true
  theme: monokai  # Developer-friendly dark theme
  theme_light: github-light
  theme_dark: monokai

editorial:
  editorials_dir: ~/Documents/tech-news
  opener_command: "code"  # VS Code for developers

refresh:
  allowed_times: ["09:00", "17:00"]  # Start of day and end of work
  max_daily_refreshes: 2
  require_confirmation_outside_hours: false  # Devs work odd hours