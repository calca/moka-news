# MoKa News - Technology News Configuration
# Perfect for developers and tech enthusiasts

ai:
  provider: gemini-cli
  language: en  # Editorial language: en, it, es, fr
  cli_timeout_seconds: 240  # Timeout for CLI-based AI providers
  
  keywords:
    - programming
    - software development
    - artificial intelligence
    - machine learning
    - web development
    - mobile development
    - devops
    - cloud computing
    - cybersecurity
    - blockchain
    - startups
    - open source

ui:
  use_tui: true
  theme: monokai  # Developer-friendly dark theme
  theme_light: github-light
  theme_dark: monokai

editorial:
  editorials_dir: ~/Documents/tech-news

refresh:
  allowed_times: ["09:00", "17:00"]  # Start of day and end of work
  max_daily_refreshes: 2
  require_confirmation_outside_hours: false  # Devs work odd hours
  auto_refresh_window: 60  # Time window in minutes around allowed times

# Tech-focused poster generation
poster:
  method: local           # Local generation for developers who prefer control
  default_template: story  # Built-in vertical story template
  posters_dir: ~/Documents/tech-news/posters
