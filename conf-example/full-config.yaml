# MoKa News - Complete Configuration Example
# This file demonstrates all available configuration options

# AI Provider Configuration
ai:
  provider: gemini-cli  # Options: openai, anthropic, gemini, mistral, copilot-cli, gemini-cli, mistral-cli, simple
  language: en  # Editorial language: en (English), it (Italian), es (Spanish), fr (French)
  
  # API Keys (recommended: use environment variables instead)
  api_keys:
    openai: null      # Set OPENAI_API_KEY env var
    anthropic: null   # Set ANTHROPIC_API_KEY env var  
    gemini: null      # Set GEMINI_API_KEY env var
    mistral: null     # Set MISTRAL_API_KEY env var
  
  # Keywords for AI to focus on (optional)
  keywords:
    - technology
    - artificial intelligence
    - programming
    - startups
    - software development
    - machine learning
  
  # Custom prompts for editorial generation (optional)
  editorial_prompts:
    system_message: "You are an experienced tech journalist creating an insightful morning briefing."
    user_prompt: |
      Create a compelling morning tech briefing from these articles:

      {content}

      Write an editorial that:
      1. Highlights the most significant tech developments
      2. Connects related stories into a coherent narrative
      3. Provides context and implications for readers
      4. Is engaging and informative (300-500 words)
      5. Has a professional yet conversational tone
    keywords_section: |

      Focus especially on developments in: {keywords}
    format_section: |

      Format as:
      TITLE: <compelling editorial title>
      SUMMARY: <the complete editorial content>
  
  # Performance and cost optimization
  max_content_length: 1500  # Max characters sent to AI (balance detail vs cost)
  max_tokens: 300           # Max AI response tokens (balance quality vs cost)

# User Interface Configuration  
ui:
  use_tui: true            # Enable beautiful Terminal UI
  theme: rose-pine         # Default theme (dark, easy on eyes)
  theme_light: rose-pine-dawn   # Light theme for day reading
  theme_dark: rose-pine    # Dark theme for evening/night

# Refresh Behavior
refresh:
  allowed_times:
    - "08:00"  # Morning briefing time
    - "13:00"  # Lunch update
    - "18:00"  # Evening wrap-up
  max_daily_refreshes: 3   # Reasonable limit to avoid spam
  require_confirmation_outside_hours: true  # Prevent accidental refreshes
  auto_refresh_window: 60  # Time window in minutes around allowed times for automatic refresh

# Editorial Configuration
editorial:
  # Custom directory for saved editorials
  editorials_dir: ~/Documents/moka-news-editorials
  
  # Article fetching configuration
  min_articles: 10         # Minimum articles needed for quality editorial
  extended_window_days: 3  # Days to look back if initial fetch has too few articles
                           # If fewer than min_articles are found, automatically
                           # expands the time window to fetch older articles

# Poster Generation Configuration
poster:
  method: local            # Generation method: local (PIL/Pillow)
  default_template: story  # Built-in template: story
  
  # Custom directories (optional)
  posters_dir: ~/Documents/moka-news-posters  # Custom poster save location
  templates_dir: null      # Custom template directory (defaults to package templates)

  # Local generation options
  local:
    font_dirs: []          # Additional directories to search for custom fonts
    default_font: arial    # Default font family: arial, times, helvetica
    optimize_output: true  # Optimize PNG for smaller file sizes
    add_watermark: true    # Add MoKa News watermark to generated posters

# ── Publishing (press 'u' in TUI) ────────────────────────────
# All enabled providers execute when you publish.
# Each provider entry needs "type" plus provider-specific settings.

publish:
  providers:
    # Write.as
    - type: writeas
      enabled: false
      api_base: https://write.as/api
      alias: null              # required (WRITEAS_ALIAS env var)
      pass: null               # required (WRITEAS_PASS env var)
      collection_alias: null   # optional (WRITEAS_COLLECTION_ALIAS env var)
      font: serif              # serif, sans, wrap, mono, code
      lang: null
      rtl: false
      timeout_seconds: 20
      verify_ssl: true

    # Buttondown Newsletter
    - type: buttondown
      enabled: false
      api_key: null            # required (BUTTONDOWN_API_KEY env var)
      api_base: https://api.buttondown.com/v1
      status: draft            # draft or about_to_send
      email_type: public       # public or private
      timeout_seconds: 20
      verify_ssl: true
