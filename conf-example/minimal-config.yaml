# MoKa News - Minimal Configuration
# Perfect for quick start and testing

ai:
  provider: gemini-cli  # Uses Google Cloud CLI (free tier available)
  language: en  # Editorial language: en, it, es, fr
  cli_timeout_seconds: 240  # Timeout for CLI-based AI providers

ui:
  use_tui: true

# Poster Generation (press 'g' in TUI to generate)
poster:
  method: local           # Use local generation (no API keys needed)
  default_template: story  # Vertical story template
