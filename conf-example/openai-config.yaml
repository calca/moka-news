# MoKa News - OpenAI Configuration
# Optimized for OpenAI GPT models

ai:
  provider: openai
  language: en  # Editorial language: en, it, es, fr
  
  # Set via environment variable: export OPENAI_API_KEY="your-key-here"
  api_keys:
    openai: null  # Use environment variable for security
  
  keywords:
    - technology
    - artificial intelligence
    - software
    - programming
  
  # GPT-optimized settings
  max_content_length: 2000  # GPT handles longer context well
  max_tokens: 250           # Good balance for summaries

feeds:
  urls:
    - https://news.ycombinator.com/rss
    - https://techcrunch.com/feed/
    - https://www.theverge.com/rss/index.xml
    - https://blog.openai.com/rss/

ui:
  use_tui: true
  theme: monokai  # Clean theme for focused reading

refresh:
  allowed_times: ["08:30", "17:30"]
  max_daily_refreshes: 2
  auto_refresh_window: 60  # Time window in minutes around allowed times